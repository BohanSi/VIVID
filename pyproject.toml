[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vivid-spatial"
version = "0.1.0"
description = "Spatial omics slice generation from two aligned endpoints"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23,<2", "scipy>=1.10,<1.15", "pandas>=1.5,<3",
  "anndata>=0.9,<0.12", "scanpy>=1.9,<1.12", "POT>=0.9,<0.10",
  "torch>=2.0,<2.6", "torchvision>=0.15,<0.21", "scikit-learn>=1.2,<1.7", "scikit-image>=0.20,<0.25",
  "matplotlib>=3.7,<3.10", "Pillow>=9.5,<12", "tqdm>=4.64", "ipython>=8",
  "opencv-python>=4.8,<4.12"
]

[project.optional-dependencies]
gurobi = ["gurobipy>=10,<13"]
tutorial = ["jupyterlab>=4", "ipykernel>=6", "nbformat>=5"]
dev = ["pytest>=7", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
